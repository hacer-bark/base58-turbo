[package]
name = "base58-turbo"
version = "0.3.0"
rust-version = "1.87"
edition = "2024"
readme = "README.md"
authors = ["Hacer-Bark <hacer.bark@proton.me>"]
license = "0BSD"
description = "A Rust Base58 codec that decodes past 2 GiB/s, with matrix-multiplication scalar kernels. 100% safe Rust, #![forbid(unsafe_code)]."
repository = "https://github.com/hacer-bark/base58-turbo"
homepage = "https://github.com/hacer-bark/base58-turbo"
documentation = "https://docs.rs/base58-turbo"
keywords = ["base58", "encoding", "decoding", "performance", "crypto"]
categories = ["encoding", "cryptography", "no-std"]
exclude = ["benches/scripts/", "benches/results/"]

[features]
default = ["std"]
std = []
serde = ["std", "dep:serde"]

[dependencies]
serde = { version = "1", optional = true, features = ["derive"] }

[dev-dependencies]
rand = "0.10"
criterion = { version = "0.8", features = ["html_reports"] }
bs58 = "0.5"
base58 = "0.2"
five8 = "1"
serde_json = "1"
base58-monero = "2"

[lints.rust]
warnings = "deny"
future_incompatible = "deny"
unused = "deny"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unsafe_code = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
cargo = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[lints.rustdoc]
all = "deny"
broken_intra_doc_links = "deny"

[[bench]]
name = "encoding_bench"
harness = false
