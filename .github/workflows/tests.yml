name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  checks:
    name: fmt / clippy / msrv / audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: rustfmt
        run: cargo fmt --all --check
      - name: cargo-audit
        run: cargo audit
      - name: clippy
        run: cargo clippy --locked --all-targets
      - name: clippy (no_std, lib only)
        run: cargo clippy --locked --lib --no-default-features
      - uses: dtolnay/rust-toolchain@1.87
      - name: msrv (1.87)
        run: cargo +1.87 check --locked --all-features

  no-std:
    name: no_std (bare-metal target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
      - name: check lib on thumbv6m-none-eabi
        run: cargo check --locked --no-default-features --lib --target thumbv6m-none-eabi

  test:
    name: "test (${{ matrix.name }})"
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: macos
            os: macos-latest
          - name: windows
            os: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          key: ${{ matrix.name }}
      - name: test
        run: cargo test --locked

  test-x86:
    name: "test (32-bit, ${{ matrix.target }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [i686-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          key: ${{ matrix.target }}
      - name: install 32-bit toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib libc6-dev-i386
      - name: test
        run: cargo test --locked --target ${{ matrix.target }}

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
      - run: cargo doc --locked --all-features --no-deps
